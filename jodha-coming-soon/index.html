<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jodha’s Hospitality | Coming Soon</title>
<meta name="description" content="The new Jodha’s Hospitality website is coming soon. Sign up to our newsletter to be the first to know.">
<meta name="theme-color" content="#0C3530">
<link rel="icon" type="image/png" href="images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;700&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <section class="left" aria-label="Newsletter">
    <span class="dots" aria-hidden="true"></span>

    <div class="mid">
      <div class="logo">
        <img src="images/logo-mark.png" alt="" width="61" height="104">
        <b>Jodha’s</b>
        <small>Hospitality</small>
      </div>

      <p class="sub">Under Construction</p>
      <h1>Our Website is Coming Soon</h1>
      <span class="dots" aria-hidden="true"></span>
      <p class="lead">Sign up now to our newsletter and you will be one of the first to know when our new website is ready.</p>

      <form class="form" id="newsForm" novalidate>
        <label for="email" style="position:absolute;left:-9999px">Your email address</label>
        <input type="email" id="email" name="email" placeholder="Your Email" autocomplete="email" inputmode="email">
        <button class="send" type="submit">Send</button>
      </form>
      <p class="msg" id="msg" role="status"></p>

      <nav class="social" aria-label="Social media">
        <a href="#" data-social="Facebook" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.6-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H8v3h2.6V21h2.9z"/></svg></a>
        <a href="#" data-social="X" aria-label="X"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4.5l14 15M19 4.5L5 19.5"/></svg></a>
        <a href="#" data-social="Instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg></a>
      </nav>
    </div>

    <div class="orn" aria-hidden="true"><i></i><span class="pt"></span><span class="ring"></span><span class="pt"></span><i></i></div>
  </section>

  <section class="right" aria-label="Launch countdown and contact">
    <div class="slides" aria-hidden="true"><div class="slide s1"></div><div class="slide s2"></div><div class="slide s3"></div></div>
    <span class="c tl" aria-hidden="true"></span><span class="c tr" aria-hidden="true"></span><span class="c bl" aria-hidden="true"></span><span class="c br" aria-hidden="true"></span>

    <div class="bookbox"><a class="btn" href="https://wa.me/919521356717?text=Hello%2C%20I%20would%20like%20to%20book%20a%20room." target="_blank" rel="noopener">Book a room</a></div>

    <div class="count" role="timer" aria-label="Time left until launch">
      <div class="unit"><b id="cd">00</b><span>Days</span></div><i class="sep" aria-hidden="true"></i>
      <div class="unit"><b id="ch">00</b><span>Hours</span></div><i class="sep" aria-hidden="true"></i>
      <div class="unit"><b id="cm">00</b><span>Minutes</span></div><i class="sep" aria-hidden="true"></i>
      <div class="unit"><b id="cs">00</b><span>Seconds</span></div>
    </div>

    <div class="foot">
      <div class="mark" aria-hidden="true"><i></i><span></span><i></i></div>
      <div class="info">
        <a href="tel:+919521356717"><span class="k">Call :</span> +91 95213 56717</a><span class="dot" aria-hidden="true"></span>
        <a href="mailto:hello@jodhahospatablity.com"><span class="k">Write :</span> hello@jodhahospatablity.com</a>
        <a href="https://www.google.com/maps/search/?api=1&query=Udaipur+Rajasthan" target="_blank" rel="noopener" class="find"><span class="k">Find us :</span> Udaipur</a>
      </div>
    </div>
  </section>
</div>

<script src="js/main.js"></script>
</body>
</html>
